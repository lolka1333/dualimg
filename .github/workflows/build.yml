name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) MIPS32r1 big-endian SOFT-FLOAT toolchain (musl-cross-make).
      - name: Cache musl-cross-make toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: /opt/mips-linux-muslsf
          key: muslsf-mips32-gcc14-v1

      - name: Build musl-cross-make (mips-linux-muslsf, --with-arch=mips32 --with-float=soft)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget bison flex texinfo git
          cd /tmp
          git clone --depth=1 https://github.com/richfelker/musl-cross-make.git
          cd musl-cross-make
          # Pin the components. musl-cross-make defaults to a GCC 9 era toolchain, and
          # sources that old no longer build on the current ubuntu-latest image (24.04,
          # host GCC 13) - which is exactly how this step began failing the first time the
          # toolchain cache expired and it had to build again instead of restoring.
          cat > config.mak <<'EOF'
          TARGET = mips-linux-muslsf
          OUTPUT = /opt/mips-linux-muslsf
          GCC_VER = 14.2.0
          BINUTILS_VER = 2.44
          MUSL_VER = 1.2.5
          GCC_CONFIG += --with-arch=mips32 --with-float=soft
          EOF
          # Keep the output so a failure can be reported in an annotation: job logs need
          # a sign-in to read, annotations do not, and guessing at this has cost two runs.
          ok=0
          for i in 1 2 3; do
            if make -j"$(nproc)" > /tmp/mcm.log 2>&1; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "host: $(lsb_release -ds 2>/dev/null), gcc $(gcc -dumpversion)"
            echo "--- first errors ---"
            tail -80 /tmp/mcm.log
            # The log is mostly tar listings, so the first line matching "error" is a
            # file name, not a failure. What matters is the end of it.
            echo "::error::TAIL $(tail -c 700 /tmp/mcm.log | tr '\n' '|' | tr -s '|')"
            echo "::error::MAKE $(grep -E 'Error [0-9]|error:|cannot |not found' /tmp/mcm.log | tail -4 | tr '\n' '|' | cut -c1-700)"
            exit 1
          fi
          make install > /tmp/mcm-install.log 2>&1 || {
            tail -40 /tmp/mcm-install.log
            echo "::error::make install failed: $(tail -c 500 /tmp/mcm-install.log | tr '\n' ' ')"
            exit 1
          }

      - name: Keep the toolchain build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musl-cross-make-log
          path: /tmp/mcm*.log
          if-no-files-found: ignore

      - name: Add toolchain to PATH
        run: echo "/opt/mips-linux-muslsf/bin" >> "$GITHUB_PATH"

      # 2) Nightly Rust + rust-src (MIPS32 is Tier 3 -> build-std).
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup default nightly
          rustc --version

      # 3) Build the static MIPS flasher (target + build-std from .cargo/config.toml).
      - name: Build
        run: cargo +nightly build -Z json-target-spec --release

      - name: Inspect ELF
        run: |
          F=target/mips-rv6699/release/dualimg
          /opt/mips-linux-muslsf/bin/mips-linux-muslsf-readelf -hA "$F" | head -40
          ls -l "$F"

      - uses: actions/upload-artifact@v4
        with:
          name: dualimg-mips
          path: |
            target/mips-rv6699/release/dualimg
            target/mips-rv6699/release/voipcli
